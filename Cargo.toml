cargo-features = ["profile-rustflags"]

[package]
name = "twedia"
description = "the video editor for your pocket!"
version = "0.1.0"
edition = "2024"

[package.metadata.bundle]
identifier = "io.github.Elec3137.twedia"
linux_mime_types = [
  "video/matroshka",
  "video/webm",
  "video/mp4",

  "audio/matroshka",
  "audio/webm",
  "audio/mp4",

  "audio/aac",
  "audio/flac",
  "audio/ogg",
]

[dependencies]
ffmpeg-next = "9.0.0"
iced = { version = "0.14.0", features = ["image-without-codecs", "smol"] }
iced_runtime = "0.14.0"
open = "5.4.5"
rfd = "0.17.2"
smol = "2.0.2"
thiserror = "2.0.21"

[profile.debug]
debug = true
strip = "none"
debug-assertions = true
overflow-checks = true

[profile.dev]
opt-level = 3
rustflags = ["-Clink-arg=-fuse-ld=mold"]

debug = false
strip = "debuginfo"
debug-assertions = false
overflow-checks = false

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = "symbols"
